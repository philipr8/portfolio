<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beyond the Wall — a runner by Philip Radeff</title>
  <meta name="description" content="Beyond the Wall: an endless runner where Jon Snow outruns White Walkers. Space or tap to jump, double-jump for the tall ones.">
  <meta name="theme-color" content="#050507">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f4f2ed'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-style='italic' font-size='34' text-anchor='middle' fill='%23060607'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Geist+Mono:wght@400;500&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; --text: #f4f2ed; --text-2: rgba(244,242,237,.66); --text-3: rgba(244,242,237,.42); --line: rgba(255,255,255,.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #050507; }
    body { font-family: "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; touch-action: none; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; display: block; cursor: pointer; touch-action: none; }
    .bar {
      position: fixed; left: 0; right: 0; top: 0; z-index: 10;
      height: calc(56px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) clamp(16px, 4vw, 32px) 0;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: linear-gradient(rgba(5,5,7,.85), rgba(5,5,7,0)); pointer-events: none;
    }
    .bar a, .bar span { pointer-events: auto; }
    .bar a { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); color: var(--text); text-decoration: none; font-size: .875rem; font-weight: 500; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: rgba(5,5,7,.4); transition: background .2s, border-color .2s; }
    .bar a:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.3); }
    .bar a svg { width: 14px; height: 14px; }
    .bar .title { font-family: "Cinzel", serif; font-weight: 700; letter-spacing: .22em; font-size: .75rem; text-transform: uppercase; color: rgba(200,232,248,.85); }
    .bar .best { font-family: "Geist Mono", ui-monospace, monospace; font-size: .75rem; letter-spacing: .12em; color: var(--text-3); text-transform: uppercase; font-variant-numeric: tabular-nums; }
    .bar .best b { color: var(--text); font-weight: 500; margin-left: 6px; }
    @media (max-width: 560px) { .bar .title { display: none; } }
    .hint { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); text-align: center; font-family: "Geist Mono", monospace; font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); pointer-events: none; z-index: 10; }
    :focus-visible { outline: 2px solid #8fd6c2; outline-offset: 3px; }
  </style>
</head>
<body>

<header class="bar">
  <a href="index.html" aria-label="Back to portfolio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6 6m-6-6 6-6"/></svg>Portfolio</a>
  <span class="title">Beyond the Wall</span>
  <span class="best">Best<b id="best">0</b></span>
</header>

<canvas id="game" aria-label="Beyond the Wall — endless runner. Press space or tap to jump." role="img"></canvas>
<div class="hint" id="hint">Space / tap to jump · double-jump for tall walkers · don't jump into ravens</div>

<script>
(() => {
  'use strict';

  // ─── Setup ───────────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const bestEl = document.getElementById('best');
  const hintEl = document.getElementById('hint');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rnd = (a, b) => a + Math.random() * (b - a);

  // ─── Constants (tuned for 60 fps units; dt scales them) ─────────
  const G = 0.55, JUMP = -13.5, JUMP2 = -11;
  const PW = 34, PH = 64;
  const SPEED0 = 6.5, SPEEDMAX = 15.5;
  const STATE = { IDLE: 0, PLAY: 1, DEAD: 2, PAUSE: 3 };
  const BEST_KEY = 'btw-best';

  const C = {
    sky: ['#04060f', '#0a1428', '#0e1f3a'],
    jon: { skin: '#c8956a', fur: '#5c5040' },
    ww: { bodyDark: '#2a6898', eyes: '#00f0ff' },
    gold: '#c8a84a', ice: '#4ab8e8', white: '#e8f0f8',
  };

  // ─── State ───────────────────────────────────────────────────────
  let W = 0, H = 0, dpr = 1, groundY = 0;
  let state = STATE.IDLE;
  let score = 0, speed = SPEED0, t = 0, lastTs = 0;
  let best = parseInt(localStorage.getItem(BEST_KEY) || localStorage.getItem('gotRunnerHS') || '0', 10) || 0;
  let deadAt = 0, shake = 0, flash = 0, newBest = false;
  let player = null, obstacles = [], particles = [];
  let stars = [], snow = [], mtnFar = [], mtnNear = [];
  let groundOff = 0, farOff = 0, nearOff = 0, travel = 0, nextSpawn = 600;
  let fontsReady = false;

  bestEl.textContent = best;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = Math.floor(H * 0.78);
    buildStars(); buildSnow(); buildMountains();
    if (player) { player.x = playerX(); if (player.onGround) player.y = groundY; }
  }

  const playerX = () => clamp(W * 0.12, 80, 170);
  function resetPlayer() { player = { x: playerX(), y: groundY, vy: 0, onGround: true, jumps: 2, runFrame: 0, runT: 0 }; }

  function initGame() {
    state = STATE.IDLE; score = 0; speed = SPEED0; t = 0;
    obstacles = []; particles = []; travel = 0; nextSpawn = 600; shake = 0; flash = 0; newBest = false;
    groundOff = farOff = nearOff = 0;
    resetPlayer();
  }

  // ─── World builders ──────────────────────────────────────────────
  function buildStars() {
    stars = Array.from({ length: Math.floor(W / 6) }, () => ({
      x: Math.random() * W, y: Math.random() * groundY * 0.9, r: Math.random() * 1.3 + 0.3,
      o: Math.random() * Math.PI * 2, s: Math.random() * 0.04 + 0.01, b: Math.random() * 0.5 + 0.35,
    }));
  }
  function buildSnow() {
    const n = reduced ? 40 : Math.floor(W / 7);
    snow = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 0.5,
      vy: Math.random() * 1.1 + 0.3, vx: (Math.random() - 0.5) * 0.6, a: Math.random() * 0.5 + 0.2,
    }));
  }
  function ridge(seed, baseFrac, amp, segs, len) {
    // deterministic-ish jagged ridge over [0, len]
    let s = seed; const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const jitter = (i === 0 || i === segs) ? 0 : (r() - 0.5) * 0.7;   // irregular spacing
      const x = ((i + jitter) / segs) * len;
      const peak = i % 2 === 0 ? 0.35 + r() * 0.65 : r() * 0.4;        // even = peaks, odd = valleys
      const y = groundY - groundY * baseFrac - peak * amp;
      pts.push([x, y]);
    }
    pts[segs][1] = pts[0][1]; // seamless tile
    return pts;
  }
  function buildMountains() {
    const L = Math.max(W, 1200) * 1.4;
    mtnFar = { len: L, pts: ridge(7, 0.30, groundY * 0.30, 22, L) };
    mtnNear = { len: L, pts: ridge(13, 0.09, groundY * 0.17, 26, L) };
  }

  // ─── Spawning (distance-based, so speed never makes gaps unfair) ──
  function airtimeFrames() { return (2 * Math.abs(JUMP)) / G; }
  function gap() { const min = speed * airtimeFrames() * 1.1 + 160; return min + Math.random() * min * 0.9; }
  function spawn() {
    const r = Math.random(), x = W + 40;
    if (score > 350 && r < 0.17) {
      obstacles.push({ type: 'raven', x, w: 46, h: 26, y: groundY - 118, vx: 1.35, flap: Math.random() * 6 });
    } else if (r < 0.56) {
      obstacles.push({ type: 'walker', x, w: 40, h: 72, y: groundY });
    } else if (r < 0.82) {
      obstacles.push({ type: 'walker_tall', x, w: 36, h: 90, y: groundY });
    } else {
      obstacles.push({ type: 'walker', x, w: 40, h: 72, y: groundY });
      obstacles.push({ type: 'walker', x: x + 76, w: 40, h: 72, y: groundY });
    }
    nextSpawn = gap();
  }

  // ─── Input ───────────────────────────────────────────────────────
  function act() {
    if (state === STATE.IDLE) { state = STATE.PLAY; hintEl.style.opacity = '0'; return; }
    if (state === STATE.PAUSE) { state = STATE.PLAY; return; }
    if (state === STATE.DEAD) { if (performance.now() - deadAt > 550) { initGame(); state = STATE.PLAY; } return; }
    if (player.jumps > 0) {
      player.vy = player.jumps === 2 ? JUMP : JUMP2;
      player.onGround = false; player.jumps--;
      puff(player.x + PW / 2, player.y, 6);
    }
  }
  document.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); act(); }
    else if (e.code === 'KeyR' && state === STATE.DEAD) { initGame(); state = STATE.PLAY; }
    else if (e.code === 'KeyP' || e.code === 'Escape') { if (state === STATE.PLAY) state = STATE.PAUSE; else if (state === STATE.PAUSE) state = STATE.PLAY; }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); act(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === STATE.PLAY) state = STATE.PAUSE; });
  window.addEventListener('resize', resize, { passive: true });

  // ─── Particles ───────────────────────────────────────────────────
  function puff(x, y, n) {
    for (let i = 0; i < n; i++) particles.push({ x, y, vx: rnd(-1.5, 1.5), vy: rnd(-1.2, -0.2), r: rnd(1.5, 3.5), life: 1, decay: rnd(0.03, 0.06), c: '220,235,245' });
  }
  function shatter(x, y) {
    for (let i = 0; i < 46; i++) {
      const a = Math.random() * Math.PI * 2, v = rnd(2, 9);
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, r: rnd(1.5, 4), life: 1, decay: rnd(0.012, 0.03), c: Math.random() < 0.5 ? '140,220,255' : '232,248,255', g: 0.25 });
    }
  }

  // ─── Update ──────────────────────────────────────────────────────
  function update(dt) {
    t += dt;
    // snow always drifts
    for (const s of snow) {
      s.y += s.vy * dt; s.x += (s.vx - (state === STATE.PLAY ? speed * 0.08 : 0)) * dt;
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
      if (s.x > W + 4) s.x = -4; else if (s.x < -4) s.x = W + 4;
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0.08) * dt; p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - 1.2 * dt);
    if (flash > 0) flash = Math.max(0, flash - 0.06 * dt);

    if (state !== STATE.PLAY) return;

    speed = Math.min(SPEEDMAX, SPEED0 + score * 0.0011);
    score += speed * 0.04 * dt;
    groundOff += speed * dt; farOff += speed * 0.12 * dt; nearOff += speed * 0.28 * dt;

    // physics
    player.vy += G * dt; player.y += player.vy * dt;
    if (player.y >= groundY) {
      if (!player.onGround) puff(player.x + PW / 2, groundY, 4);
      player.y = groundY; player.vy = 0; player.onGround = true; player.jumps = 2;
    } else player.onGround = false;
    if (player.onGround) { player.runT += dt; if (player.runT > 6) { player.runT = 0; player.runFrame ^= 1; } }

    // spawn by distance
    travel += speed * dt;
    if (travel >= nextSpawn) { travel = 0; spawn(); }

    // obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed * (o.type === 'raven' ? o.vx : 1) * dt;
      if (o.type === 'raven') o.flap += 0.35 * dt;
      if (o.x + o.w < -20) obstacles.splice(i, 1);
    }

    // collisions
    const px = player.x + 8, pw = PW - 14, py = player.y - PH + 12, ph = PH - 14;
    for (const o of obstacles) {
      let ox, oy, ow, oh;
      if (o.type === 'raven') { ox = o.x + 5; oy = o.y + 3; ow = o.w - 10; oh = o.h - 6; }
      else { ox = o.x + 6; oy = o.y - o.h + 10; ow = o.w - 10; oh = o.h - 12; }
      if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) { die(); break; }
    }
  }

  function die() {
    state = STATE.DEAD; deadAt = performance.now();
    shake = reduced ? 0 : 14; flash = 1;
    shatter(player.x + PW / 2, player.y - PH / 2);
    if (score > best) { best = Math.floor(score); newBest = true; localStorage.setItem(BEST_KEY, String(best)); bestEl.textContent = best; }
    hintEl.style.opacity = '1';
  }

  // ─── Drawing: environment ────────────────────────────────────────
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, C.sky[0]); g.addColorStop(0.45, C.sky[1]); g.addColorStop(1, C.sky[2]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY);
  }
  function drawStars() {
    for (const s of stars) {
      const a = clamp(s.b + Math.sin(t * s.s + s.o) * 0.3, 0, 1);
      ctx.fillStyle = `rgba(220,235,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawMoon() {
    const mx = W * 0.78, my = H * 0.14, mr = clamp(W * 0.03, 26, 44);
    const g = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 2.6);
    g.addColorStop(0, 'rgba(180,210,255,0.22)'); g.addColorStop(1, 'rgba(180,210,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, mr * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#cce0f8'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.sky[0]; ctx.beginPath(); ctx.arc(mx + mr * 0.42, my - mr * 0.16, mr * 0.82, 0, Math.PI * 2); ctx.fill();
  }
  function drawRidge(m, off, color) {
    const L = m.len, o = off % L;
    ctx.fillStyle = color;
    for (let k = -1; k <= 1; k++) {
      const base = -o + k * L;
      if (base > W || base + L < 0) continue;
      ctx.beginPath(); ctx.moveTo(base, groundY);
      for (const [x, y] of m.pts) ctx.lineTo(base + x, y);
      ctx.lineTo(base + L, groundY); ctx.closePath(); ctx.fill();
    }
  }
  function drawWall() {
    const wx = W * 0.66, wy = H * 0.05, ww = W * 0.36, wh = groundY - wy;
    const g = ctx.createLinearGradient(wx, wy, wx + ww, wy + wh);
    g.addColorStop(0, 'rgba(140,180,220,0.26)'); g.addColorStop(0.4, 'rgba(100,150,200,0.18)'); g.addColorStop(1, 'rgba(60,110,170,0.10)');
    ctx.fillStyle = g; ctx.fillRect(wx, wy, ww, wh);
    ctx.strokeStyle = 'rgba(100,150,200,0.10)'; ctx.lineWidth = 1;
    for (let row = wy + 20, r = 0; row < groundY; row += 22, r++) {
      ctx.beginPath(); ctx.moveTo(wx, row); ctx.lineTo(wx + ww, row); ctx.stroke();
      const joff = r % 2 ? 30 : 0;
      for (let col = wx + joff; col < wx + ww; col += 60) { ctx.beginPath(); ctx.moveTo(col, row); ctx.lineTo(col, row + 22); ctx.stroke(); }
    }
    ctx.fillStyle = 'rgba(120,170,210,0.26)';
    for (let bx = wx + 4; bx < wx + ww - 18; bx += 28) ctx.fillRect(bx, wy - 22, 18, 22);
    ctx.strokeStyle = 'rgba(180,220,255,0.18)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx, groundY); ctx.stroke();
  }
  function drawGround() {
    const g = ctx.createLinearGradient(0, groundY, 0, H);
    g.addColorStop(0, '#d8eaf4'); g.addColorStop(0.12, '#b8d2e4'); g.addColorStop(1, '#5e8eae');
    ctx.fillStyle = g; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = '#eef6ff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.strokeStyle = 'rgba(80,120,160,0.35)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([12, 30]); ctx.lineDashOffset = -groundOff % 42;
    ctx.beginPath(); ctx.moveTo(0, groundY + 14); ctx.lineTo(W, groundY + 14); ctx.stroke();
    ctx.setLineDash([]);
  }
  function drawSnow() {
    for (const s of snow) { ctx.fillStyle = `rgba(220,235,245,${s.a})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill(); }
  }
  function drawParticles() {
    for (const p of particles) { ctx.fillStyle = `rgba(${p.c},${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill(); }
  }

  // ─── Drawing: characters ─────────────────────────────────────────
  function drawJon(p, rf, dead) {
    const x = p.x, bot = p.y, h = PH, midX = x + PW / 2;
    const legSwing = p.onGround ? (rf === 0 ? 1 : -1) : 0;
    const legA = legSwing * 14, legB = -legSwing * 14, bend = p.onGround ? 0 : -10;

    ctx.save();
    if (dead) ctx.globalAlpha = 0.9;
    // cloak
    ctx.fillStyle = '#10111e'; ctx.beginPath();
    ctx.moveTo(midX - 18, bot - h + 18);
    ctx.quadraticCurveTo(midX - 28, bot - h / 2, midX - 22 + (p.onGround ? legA * 0.4 : -8), bot + 2);
    ctx.quadraticCurveTo(midX - 8, bot - h / 3, midX - 12, bot - h + 18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#0e0f1c'; ctx.beginPath();
    ctx.moveTo(midX + 16, bot - h + 18);
    ctx.quadraticCurveTo(midX + 26, bot - h / 2, midX + 20 + (p.onGround ? legB * 0.4 : 8), bot + 2);
    ctx.quadraticCurveTo(midX + 6, bot - h / 3, midX + 10, bot - h + 18); ctx.closePath(); ctx.fill();
    // legs
    ctx.strokeStyle = '#1a1c2c'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(midX - 7, bot - 20); ctx.quadraticCurveTo(midX - 7 + legA * 0.5, bot - 8 + bend, midX - 7 + legA, bot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midX + 7, bot - 20); ctx.quadraticCurveTo(midX + 7 + legB * 0.5, bot - 8 + bend, midX + 7 + legB, bot); ctx.stroke();
    ctx.strokeStyle = '#2a2c3c'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(midX - 7 + legA - 4, bot - 2); ctx.lineTo(midX - 7 + legA + 6, bot - 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midX + 7 + legB - 4, bot - 2); ctx.lineTo(midX + 7 + legB + 6, bot - 2); ctx.stroke();
    // torso
    const bg = ctx.createLinearGradient(midX - 14, 0, midX + 14, 0);
    bg.addColorStop(0, '#1c1e30'); bg.addColorStop(0.5, '#26283c'); bg.addColorStop(1, '#1a1c2a');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(midX - 14, bot - h + 20, 28, 36, 3); ctx.fill();
    ctx.fillStyle = C.jon.fur; ctx.beginPath(); ctx.roundRect(midX - 16, bot - h + 18, 32, 10, 4); ctx.fill();
    ctx.strokeStyle = '#4a3c30'; ctx.lineWidth = 1;
    for (let fx = midX - 12; fx < midX + 14; fx += 5) { ctx.beginPath(); ctx.moveTo(fx, bot - h + 18); ctx.lineTo(fx, bot - h + 28); ctx.stroke(); }
    ctx.fillStyle = '#3a2a18'; ctx.fillRect(midX - 14, bot - h + 50, 28, 5);
    ctx.fillStyle = '#8a7040'; ctx.fillRect(midX - 4, bot - h + 49, 8, 7);
    // head
    const hy = bot - h + 14;
    ctx.fillStyle = C.jon.skin; ctx.fillRect(midX - 5, hy, 10, 8);
    ctx.beginPath(); ctx.ellipse(midX, hy - 8, 13, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1008';
    ctx.beginPath(); ctx.ellipse(midX, hy - 14, 13, 10, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(midX - 10, hy - 8, 4, 8, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(midX + 10, hy - 8, 4, 8, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(midX, hy + 3, 7, 5, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = dead ? '#9ad' : '#2a3848';
    ctx.beginPath(); ctx.arc(midX - 4, hy - 10, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(midX + 4, hy - 10, 2, 0, Math.PI * 2); ctx.fill();
    // Longclaw
    const sb = { x: midX + 14, y: bot - h + 42 }, st = { x: midX + 34, y: bot - h - 10 };
    ctx.shadowColor = 'rgba(200,220,240,0.5)'; ctx.shadowBlur = 8;
    ctx.strokeStyle = '#d8e8f0'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sb.x, sb.y); ctx.lineTo(st.x, st.y); ctx.stroke();
    ctx.strokeStyle = 'rgba(200,220,240,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sb.x - 1, sb.y - 2); ctx.lineTo(st.x - 1, st.y + 2); ctx.stroke();
    ctx.fillStyle = '#8090a0'; ctx.fillRect(sb.x - 6, sb.y - 4, 12, 5);
    ctx.shadowBlur = 0;
    ctx.fillStyle = C.jon.skin; ctx.beginPath(); ctx.arc(sb.x, sb.y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawWalker(o) {
    const x = o.x, bot = o.y, h = o.h, tall = o.type === 'walker_tall', midX = x + o.w / 2;
    const legSwing = Math.floor(t / 8) % 2 === 0 ? 1 : -1;
    const aura = ctx.createRadialGradient(midX, bot - h / 2, 5, midX, bot - h / 2, tall ? 70 : 55);
    aura.addColorStop(0, 'rgba(80,200,255,0.14)'); aura.addColorStop(1, 'rgba(80,200,255,0)');
    ctx.fillStyle = aura; ctx.beginPath(); ctx.ellipse(midX, bot - h / 2, tall ? 70 : 55, tall ? 80 : 60, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = C.ww.bodyDark; ctx.lineWidth = 7; ctx.lineCap = 'round';
    const la = legSwing * 12, lb = -legSwing * 12;
    ctx.beginPath(); ctx.moveTo(midX - 6, bot - 22); ctx.quadraticCurveTo(midX - 6 + la * 0.5, bot - 10, midX - 6 + la, bot); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(midX + 6, bot - 22); ctx.quadraticCurveTo(midX + 6 + lb * 0.5, bot - 10, midX + 6 + lb, bot); ctx.stroke();
    const bodyH = h - 30;
    const bg = ctx.createLinearGradient(midX - 14, 0, midX + 14, 0);
    bg.addColorStop(0, '#1a4a6a'); bg.addColorStop(0.5, '#2a7aaa'); bg.addColorStop(1, '#1a4a6a');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(midX - 14, bot - bodyH - 22, 28, bodyH, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(140,220,255,0.4)'; ctx.lineWidth = 1;
    for (const [dx, dy] of [[0, -10], [8, -4], [-8, -4], [4, -16], [-4, -16]]) {
      ctx.beginPath(); ctx.moveTo(midX + dx, bot - bodyH / 2 + dy); ctx.lineTo(midX + dx + 4, bot - bodyH / 2 + dy - 8); ctx.lineTo(midX + dx - 2, bot - bodyH / 2 + dy - 5); ctx.closePath(); ctx.stroke();
    }
    const hy = bot - h + 14;
    ctx.fillStyle = '#8ad0f0'; ctx.beginPath(); ctx.ellipse(midX, hy, 14, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5ab0d8'; ctx.beginPath(); ctx.ellipse(midX, hy + 4, 9, 6, 0, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#c8ecff';
    [-12, -7, 0, 7, 12].forEach((dx, i) => { const sh = [14, 20, 24, 20, 14][i]; ctx.beginPath(); ctx.moveTo(midX + dx - 4, hy - 12); ctx.lineTo(midX + dx, hy - 12 - sh); ctx.lineTo(midX + dx + 4, hy - 12); ctx.closePath(); ctx.fill(); });
    ctx.shadowColor = C.ww.eyes; ctx.shadowBlur = 14; ctx.fillStyle = C.ww.eyes;
    ctx.beginPath(); ctx.ellipse(midX - 5, hy - 2, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(midX + 5, hy - 2, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    const sl = tall ? 85 : 72;
    ctx.shadowColor = 'rgba(100,200,255,0.5)'; ctx.shadowBlur = 6; ctx.strokeStyle = '#b0e0ff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(midX - 16, bot - h + 36); ctx.lineTo(midX - 16 - sl * 0.7, bot - h + 36 + sl * 0.4); ctx.stroke();
    ctx.fillStyle = '#e8f8ff'; ctx.beginPath();
    ctx.moveTo(midX - 16 - sl * 0.7 - 10, bot - h + 36 + sl * 0.4 + 6); ctx.lineTo(midX - 16 - sl * 0.7 + 4, bot - h + 36 + sl * 0.4 - 4); ctx.lineTo(midX - 16 - sl * 0.7 + 2, bot - h + 36 + sl * 0.4 + 8); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = C.ww.bodyDark; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(midX - 14, bot - bodyH - 5); ctx.quadraticCurveTo(midX - 26, bot - bodyH + 16, midX - 30, bot - bodyH + 30); ctx.stroke();
  }

  function drawRaven(o) {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2, w = Math.sin(o.flap) * 12;
    ctx.fillStyle = '#0a0b12';
    ctx.beginPath(); ctx.ellipse(cx, cy, 14, 7, 0, 0, Math.PI * 2); ctx.fill();            // body
    ctx.beginPath(); ctx.moveTo(cx - 4, cy - 2); ctx.lineTo(cx - 22, cy - 6 - w); ctx.lineTo(cx - 8, cy + 2); ctx.closePath(); ctx.fill(); // wing L
    ctx.beginPath(); ctx.moveTo(cx + 4, cy - 2); ctx.lineTo(cx + 18, cy - 6 - w); ctx.lineTo(cx + 8, cy + 2); ctx.closePath(); ctx.fill(); // wing R
    ctx.beginPath(); ctx.arc(cx - 14, cy - 3, 5, 0, Math.PI * 2); ctx.fill();               // head
    ctx.fillStyle = '#c8a84a'; ctx.beginPath(); ctx.moveTo(cx - 19, cy - 3); ctx.lineTo(cx - 26, cy - 1); ctx.lineTo(cx - 19, cy); ctx.closePath(); ctx.fill(); // beak
    ctx.shadowColor = '#ff3b30'; ctx.shadowBlur = 8; ctx.fillStyle = '#ff5a4e';
    ctx.beginPath(); ctx.arc(cx - 15, cy - 4, 1.4, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  }

  // ─── Drawing: UI ─────────────────────────────────────────────────
  const sz = (f, min, max) => clamp(W * f, min, max);
  const cinzel = (w, px) => `${w} ${px}px Cinzel, "Times New Roman", serif`;
  const mono = px => `500 ${px}px "Geist Mono", ui-monospace, Menlo, monospace`;

  function drawHUD() {
    const pad = clamp(W * 0.03, 16, 32), top = 76;
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.font = `600 ${sz(0.03, 24, 34)}px Geist, ui-sans-serif, system-ui, sans-serif`;
    ctx.fillStyle = '#e8f0f8'; ctx.fillText(String(Math.floor(score)).padStart(5, '0'), W - pad, top);
    ctx.font = mono(11); ctx.fillStyle = 'rgba(180,220,240,0.55)';
    ctx.fillText('DISTANCE', W - pad, top + 18);
  }
  function vignette(strength) {
    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,8,0)'); v.addColorStop(1, `rgba(0,0,8,${strength})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  }
  function rule(cx, y, half, alpha) {
    ctx.strokeStyle = `rgba(200,168,74,${alpha})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - half, y); ctx.lineTo(cx + half, y); ctx.stroke();
  }
  function drawStart() {
    vignette(0.6);
    const cx = W / 2, cy = H * 0.40, half = clamp(W * 0.16, 120, 200);
    ctx.textAlign = 'center';
    rule(cx, cy - 64, half, 0.5);
    ctx.fillStyle = C.gold; ctx.font = cinzel(900, sz(0.05, 26, 54)); ctx.fillText('BEYOND THE WALL', cx, cy - 12);
    ctx.fillStyle = 'rgba(200,168,74,0.7)'; ctx.font = cinzel(400, sz(0.014, 11, 15)); ctx.fillText("JON SNOW'S LAST STAND", cx, cy + 22);
    rule(cx, cy + 38, half, 0.5);
    ctx.fillStyle = 'rgba(180,220,240,0.78)'; ctx.font = mono(sz(0.012, 11, 13));
    ctx.fillText('JUMP OVER WHITE WALKERS', cx, cy + 74);
    ctx.fillText('DOUBLE-JUMP FOR THE TALL ONES', cx, cy + 96);
    ctx.fillText("STAY LOW WHEN THE RAVENS COME", cx, cy + 118);
    const pulse = 0.6 + Math.sin(t * 0.06) * 0.35;
    ctx.fillStyle = `rgba(200,232,248,${pulse})`; ctx.font = cinzel(700, sz(0.018, 12, 17));
    ctx.fillText('PRESS SPACE OR TAP TO BEGIN', cx, cy + 166);
    if (best > 0) { ctx.fillStyle = 'rgba(200,168,74,0.7)'; ctx.font = mono(12); ctx.fillText(`BEST  ${best}`, cx, cy + 196); }
  }
  function drawDead() {
    vignette(0.72);
    const cx = W / 2, cy = H * 0.38, half = clamp(W * 0.18, 140, 220);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.ice; ctx.font = cinzel(900, sz(0.055, 28, 58)); ctx.fillText('YOU KNOW NOTHING', cx, cy);
    ctx.fillStyle = 'rgba(140,200,240,0.85)'; ctx.font = cinzel(400, sz(0.02, 13, 20)); ctx.fillText('Jon Snow', cx, cy + 36);
    ctx.strokeStyle = 'rgba(74,184,232,0.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx - half, cy + 58); ctx.lineTo(cx + half, cy + 58); ctx.stroke();
    ctx.fillStyle = 'rgba(200,232,248,0.9)'; ctx.font = mono(sz(0.014, 12, 15));
    ctx.fillText(`DISTANCE  ${Math.floor(score)}`, cx, cy + 90);
    ctx.fillStyle = newBest ? C.gold : 'rgba(200,168,74,0.7)'; ctx.font = mono(sz(0.013, 11, 14));
    ctx.fillText(newBest ? 'NEW BEST' : `BEST  ${best}`, cx, cy + 114);
    const ready = performance.now() - deadAt > 550;
    const pulse = ready ? 0.6 + Math.sin(t * 0.07) * 0.4 : 0.25;
    ctx.fillStyle = `rgba(180,220,240,${pulse})`; ctx.font = cinzel(700, sz(0.017, 11, 16));
    ctx.fillText('PRESS SPACE OR TAP TO RISE AGAIN', cx, cy + 156);
  }
  function drawPause() {
    vignette(0.6);
    ctx.textAlign = 'center';
    ctx.fillStyle = C.gold; ctx.font = cinzel(700, sz(0.03, 20, 34)); ctx.fillText('PAUSED', W / 2, H * 0.42);
    ctx.fillStyle = 'rgba(180,220,240,0.8)'; ctx.font = mono(sz(0.012, 11, 13)); ctx.fillText('SPACE / TAP TO RESUME', W / 2, H * 0.42 + 34);
  }

  // ─── Render ──────────────────────────────────────────────────────
  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawSky(); drawStars(); drawMoon();
    drawRidge(mtnFar, farOff, 'rgba(8,14,28,0.92)');
    drawWall();
    drawRidge(mtnNear, nearOff, 'rgba(12,20,38,0.88)');
    drawGround();
    for (const o of obstacles) (o.type === 'raven' ? drawRaven : drawWalker)(o);
    drawJon(player, state === STATE.PLAY ? player.runFrame : 0, state === STATE.DEAD);
    drawParticles(); drawSnow();
    ctx.restore();
    if (flash > 0) { ctx.fillStyle = `rgba(160,220,255,${flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
    if (state === STATE.PLAY) drawHUD();
    else if (state === STATE.IDLE) drawStart();
    else if (state === STATE.DEAD) { drawHUD(); drawDead(); }
    else if (state === STATE.PAUSE) { drawHUD(); drawPause(); }
  }

  function frame(ts) {
    const dt = lastTs ? clamp((ts - lastTs) / 16.667, 0.25, 2.5) : 1;
    lastTs = ts;
    update(dt); render();
    requestAnimationFrame(frame);
  }

  // ─── Boot: wait briefly for the display fonts so the title never flashes a fallback ───
  resize(); initGame();
  const boot = () => { if (fontsReady) return; fontsReady = true; requestAnimationFrame(frame); };
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('900 40px Cinzel'), document.fonts.load('500 14px "Geist Mono"')]).then(boot, boot);
    setTimeout(boot, 1500);
  } else boot();
})();
</script>
</body>
</html>
